- name: setup user server
  hosts: user
  become: true
  tasks:
  - name: disaable current module
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable current module
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: add system user roboshop
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      shell: /sbin/nologin
      home: /app 
      system: true

  - name: remove app directory  
    ansible.builtin.file:
      path: /app
      state: absent    

  - name: setup app directory  
    ansible.builtin.file:
      path: /app
      state: directory 
     
  - name: remove user file
    ansible.builtin.file:
      path: /tmp/user.zip
      state: absent 

  - name: Download the application code to created app directory.
    ansible.builtin.get_url: 
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip 
      dest: /tmp/user.zip

  - name: unzip user file  
    ansible.builtin.unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes 

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: setup user service 
    ansible.builtin.copy:
      src: user.service
      dest: /etc/systemd/system/user.service

  - name: reload systemd daemons
    ansible.builtin.systemd:
      daemon_reload: yes   

  - name: enable and start user
    ansible.builtin.service:
      name: user
      state: restarted
      enabled: yes  