- name: setup cart server
  hosts: cart
  become: true
  tasks:
  - name: disaable current module
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable current module
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: add system user roboshop
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      shell: /sbin/nologin
      home: /app 
      system: true

  - name: setup app directory  
    ansible.builtin.file:
      path: /app
      state: directory 
      mode: '0755'

  - name: Download the application code to created app directory.
    ansible.builtin.get_url: 
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip 
      dest: /tmp/cart.zip

  - name: unzip cart file  
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes 

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: setup cart service 
    ansible.builtin.copy:
      src: cart.service
      dest: /etc/systemd/system/cart.service

  - name: reload systemd daemons
    ansible.builtin.systemd:
      daemon_reload: yes   

  - name: enable and start catalogue
    ansible.builtin.service:
      name: cart
      state: restarted
      enabled: yes  