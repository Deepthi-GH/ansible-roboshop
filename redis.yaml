- name: setup redis server
  hosts: redis
  tasks:
  - name: disable redis 
    ansible.builtin.command: dnf module disable redis 

  - name: enable redis 7 version
    ansible.builtin.command: dnf module enable redis:7 

  - name: install redis
    ansible.builtin.package:
      name: redis 
      state: present

  - name: update 127.0.0.1 to 0.0.0.0  
    ansible.builtin.replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: replace line protected mode
    ansible.builtin.lineinfile:
      path: /etc/redis/redis.conf
      regexp: 'protected-mode'
      line: 'protected-mode no'   

  - name: start and enable redis
    ansible.builtin.service:
      name: redis 
      state: restarted
      enabled: yes



