- name : setup payment server
  hosts: payment
  become: true
  tasks:
  - name: install python3
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop:
    - python3
    - gcc
    - python3-devel

  - name: add system user roboshop
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      shell: /sbin/nologin
      home: /app 
      system: true

  - name: remove app directory  
    ansible.builtin.file:
      path: /app
      state: absent    

  - name: setup app directory  
    ansible.builtin.file:
      path: /app
      state: directory 
     
  - name: remove payment file
    ansible.builtin.file:
      path: /tmp/payment.zip
      state: absent 

  - name: Download the application code to created app directory.
    ansible.builtin.get_url: 
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
      dest: /tmp/payment.zip

  - name: unzip payment file  
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes 

  - name: install dependencies
    ansible.builtin.pip:
      requiremets: requirements.txt
      executable: pip3.9
    args:
      chdir: /app

  - name: setup payment service 
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service  

  - name:  daemon reload enable and start payment
    ansible.builtin.systemd_service:
      name: payment
      state: restarted
      enabled: yes  
      daemon_reload: yes     

    
