- name: configure frontend server
  hosts: frontend
  become: true
  tasks:
  - name: disable nginx 
    ansible.builtin.command: dnf module disable nginx -y

  - name: enable nginx with lastest version
    ansible.builtin.command: dnf module enable nginx:1.24 -y

  - name: install nginx
    ansible.builtin.dnf:
      name: nginx
      state: present

  - name: Remove html directory
    ansible.builtin.file:
      path: /usr/share/nginx/html/
      state: absent  

  - name: create html directory
    ansible.builtin.file:
      path: /usr/share/nginx/html/
      state: directory  

  - name: remove frontend file
    ansible.builtin.file:
      path: /tmp/frontend.zip
      state: absent 

  - name: Download the application code to created app directory.
    ansible.builtin.get_url: 
      url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip 
      dest: /tmp/frontend.zip

  - name: unzip frontend file  
    ansible.builtin.unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html 
      remote_src: yes 

  - name: delete default nginx conf
    ansible.builtin.file:
      path: /etc/nginx/nginx.conf 
      state: absent

  - name: setup frontend service 
    ansible.builtin.copy:
      src: nginx.conf
      dest: /etc/nginx/nginx.conf  

  - name:  daemon reload enable and start frontend
    ansible.builtin.service:
      name: nginx
      state: restarted #restarted if u have already started earler
      enabled: yes  
      

